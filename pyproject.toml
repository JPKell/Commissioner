[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commissioner"
description = "Egress behaviour turned into an egress record: the payload, the ordered classification comparison, and (Phase 2) an append-only ledger. No enforcement, no application policy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # baseaicore: DataClassification, SuiteError, Clock, UlidGenerator (0.4.1 required — the
    # version DataClassification ships in, ADR-0046). setspec: governance.egress_decision 1.0
    # (ADR-0051 §4) — the one justified reason a capability package besides MirrorWall imports it
    # (master architecture §2): it owns the Python form of a cross-application payload.
    "baseaicore>=0.4.1,<0.5",
    "setspec>=0.5,<0.6",
]

[project.optional-dependencies]
# No `sql` extra yet. `commissioner.ledger`/`commissioner.sql` and the SqlEgressLedger arrive in Phase 2
# (development plan) — declaring the extra ahead of the module would advertise an import that does
# not exist.
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling, affecting
    # pytest through 9.0.2). Matches the pin every other suite package has already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "jsonschema>=4,<5",
]

[project.urls]
Homepage = "https://github.com/JPKell/Commissioner"
Documentation = "https://github.com/JPKell/Commissioner/tree/main/docs"
Changelog = "https://github.com/JPKell/Commissioner/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/commissioner/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/commissioner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["commissioner"]
branch = true

[tool.coverage.paths]
source = ["src/commissioner", "*/site-packages/commissioner"]

[tool.coverage.report]
# Shared packages carry a 95% floor, not the 85% applications use.
fail_under = 95
show_missing = true
